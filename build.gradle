task cleanDeploy {
	doLast {
		def targetModsDir = file("E:/BestClient/.minecraft/versions/1.20.4-Fabric/mods")
		if (targetModsDir.exists()) {
			fileTree(targetModsDir).matching {
				include "${project.archives_base_name}-*.jar"
			}.each {
				it.delete()
				println "✓ 删除: ${it.name}"
			}
		}
		println "✓ 清理完成"
	}
}
